<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bajo las estrellas de Escorpio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Dancing+Script:wght@400;500&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 40%, #0a1220 0%, #02040a 70%);
    font-family: 'Cormorant Garamond', serif;
    color: #f5f0e8;
    touch-action: none;
  }

  #watermark-svg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    pointer-events: none;
    overflow: visible;
  }

  #sky-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    background: transparent;
    cursor: grab;
  }
  #sky-canvas.dragging { cursor: grabbing; }

  #dedicatoria {
    position: fixed;
    bottom: 0; left: 0;
    width: 100%;
    padding: 20px 24px 34px;
    text-align: center;
    z-index: 10;
    pointer-events: none;
    background: linear-gradient(to top, rgba(2, 4, 10, 0.95) 0%, rgba(2, 4, 10, 0.55) 55%, transparent 100%);
  }
  #dedicatoria p {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(1.05rem, 2.2vw, 1.7rem);
    line-height: 1.55;
    letter-spacing: 0.4px;
    color: #f5f0e8;
    text-shadow: 0 2px 22px rgba(0, 0, 0, 0.85);
    max-width: 900px;
    margin: 0 auto;
  }
  #dedicatoria em {
    color: #d4e6ff;
    font-style: italic;
  }

  #focus-btn {
    position: fixed;
    bottom: 130px; right: 24px;
    z-index: 20;
    width: 46px; height: 46px;
    border-radius: 50%;
    border: 1px solid rgba(180, 210, 255, 0.15);
    background: rgba(10, 20, 40, 0.55);
    color: #d4e6ff;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    opacity: 0.45;
    transition: opacity .3s ease, border-color .3s ease, transform .3s ease;
  }
  #focus-btn:hover {
    opacity: 1;
    border-color: rgba(180, 210, 255, 0.5);
    transform: scale(1.05);
  }

  #tooltip {
    position: fixed;
    z-index: 30;
    pointer-events: none;
    padding: 6px 12px;
    background: rgba(5, 10, 22, 0.9);
    border: 1px solid rgba(140, 180, 230, 0.25);
    border-radius: 4px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 14px;
    letter-spacing: 0.5px;
    color: #d4e6ff;
    opacity: 0;
    transition: opacity .25s ease;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  #tooltip.visible { opacity: 1; }

  #loading {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 40;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.1rem;
    letter-spacing: 2px;
    color: rgba(180, 210, 255, 0.6);
    text-align: center;
  }
  #loading.hidden { display: none; }

  /* ==============================
     MENSAJES METEORO ROMÁNTICOS
     ============================== */
  .meteor-message {
    position: fixed;
    left: 0;
    top: 0;
    z-index: 5;
    font-family: 'Dancing Script', 'Brush Script MT', cursive;
    font-weight: 500;
    font-size: clamp(0.95rem, 1.5vw, 1.35rem);
    white-space: nowrap;
    pointer-events: none;
    will-change: transform, opacity;
    letter-spacing: 0.4px;
    color: var(--m-color, #ffe0a8);
    visibility: visible;
    display: block;
  }

  .meteor-message[data-dir="1"] {
    text-shadow:
      0 0 4px var(--m-glow, rgba(255,210,140,0.9)),
      0 0 10px var(--m-glow, rgba(255,210,140,0.9)),
      -4px 0 10px var(--m-glow, rgba(255,210,140,0.9)),
      -10px 0 20px var(--m-glow-soft, rgba(255,200,120,0.35)),
      -22px 0 34px var(--m-glow-softer, rgba(255,190,100,0.15));
  }
  .meteor-message[data-dir="-1"] {
    text-shadow:
      0 0 4px var(--m-glow, rgba(255,210,140,0.9)),
      0 0 10px var(--m-glow, rgba(255,210,140,0.9)),
      4px 0 10px var(--m-glow, rgba(255,210,140,0.9)),
      10px 0 20px var(--m-glow-soft, rgba(255,200,120,0.35)),
      22px 0 34px var(--m-glow-softer, rgba(255,190,100,0.15));
  }

  .meteor-message::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    transform: translateY(-50%);
    background: radial-gradient(circle, #ffffff, var(--m-glow, rgba(255,210,140,0.9)) 70%);
    box-shadow:
      0 0 8px  var(--m-glow, rgba(255,210,140,0.9)),
      0 0 18px var(--m-glow, rgba(255,210,140,0.9));
  }
  .meteor-message[data-dir="1"]::after { right: -10px; }
  .meteor-message[data-dir="-1"]::after { left: -10px; }

  @media (max-width: 600px) {
    #focus-btn { bottom: 150px; right: 16px; width: 40px; height: 40px; font-size: 18px; }
    #dedicatoria { padding: 16px 16px 24px; }
    .meteor-message { font-size: 1rem; }
  }
</style>
</head>
<body>

  <svg id="watermark-svg"></svg>
  <canvas id="sky-canvas"></canvas>

  <div id="dedicatoria">
    <p>Bajo las estrellas de <em>Escorpio</em> nació la persona que ilumina mi universo. <em>¡Feliz cumpleaños!</em>, Mi Emary hermosa ♥</p>
  </div>

  <button id="focus-btn" title="Centrar en Escorpio">♏</button>
  <div id="tooltip"></div>
  <div id="loading">Cargando el cielo nocturno…</div>

  <script src="https://d3js.org/d3.v7.min.js"></script>

  <!-- ============================================================
       MAPA ESTELAR
       ============================================================ -->
  <script>
  (function () {
    'use strict';

    const SCO_RA  = 252.5;
    const SCO_DEC = -30.7;
    const MAG_LIMIT = 6.0;

    const URLS = {
      stars: 'https://cdn.jsdelivr.net/gh/ofrohn/d3-celestial@master/data/stars.6.json',
      lines: 'https://cdn.jsdelivr.net/gh/ofrohn/d3-celestial@master/data/constellations.lines.json'
    };

    const state = {
      rotation: [-SCO_RA, -SCO_DEC, 0],
      zoom: 1,
      baseScale: 0,
      width: 0,
      height: 0,
      mapCenter: [0, 0],
      stars: [],
      constellations: [],
      dragging: false,
      didDrag: false,
      lastMouse: null
    };

    const canvas = document.getElementById('sky-canvas');
    const ctx = canvas.getContext('2d');
    const loadingEl = document.getElementById('loading');
    const tooltipEl = document.getElementById('tooltip');

    let projection = null;
    let path = null;

    function bvToRgb(bv) {
      if (bv === null || bv === undefined || isNaN(bv)) return '#ffffff';
      let r, g, b;
      if (bv < 0) {
        r = 155 + 105 * Math.min(1, (bv + 0.4) / 0.4);
        g = 170 + 85 * Math.min(1, (bv + 0.4) / 0.4);
        b = 255;
      } else if (bv < 0.4) {
        const t = bv / 0.4;
        r = 155 + 100 * t; g = 170 + 85 * t; b = 255;
      } else if (bv < 1.2) {
        const t = (bv - 0.4) / 0.8;
        r = 255; g = 255 - 45 * t; b = 255 - 90 * t;
      } else {
        const t = Math.min(1, (bv - 1.2) / 1.0);
        r = 255; g = 210 - 110 * t; b = 165 - 110 * t;
      }
      return `rgb(${r | 0},${g | 0},${b | 0})`;
    }

    function sizeFromMag(mag) {
      return Math.max(0.35, (MAG_LIMIT - mag) * 0.65);
    }

    function angularDistanceFromCenter(ra, dec) {
      const centerLon = -state.rotation[0];
      const centerLat = -state.rotation[1];
      return d3.geoDistance([ra, dec], [centerLon, centerLat]);
    }

    async function loadData() {
      const [starsGeo, linesGeo] = await Promise.all([
        d3.json(URLS.stars),
        d3.json(URLS.lines)
      ]);

      state.stars = starsGeo.features
        .map(f => {
          const [ra, dec] = f.geometry.coordinates;
          return {
            ra, dec,
            mag: f.properties.mag,
            bv: f.properties.bv,
            name: f.properties.name || f.properties.desig || null,
            color: bvToRgb(f.properties.bv)
          };
        })
        .filter(s => s.mag <= MAG_LIMIT);

      state.constellations = linesGeo.features;
    }

    function setupCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const w = window.innerWidth;
      const h = window.innerHeight;

      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      state.width = w;
      state.height = h;
      const mapAreaHeight = h - 120;
      state.baseScale = Math.min(w, mapAreaHeight) * 0.44;
      state.mapCenter = [w / 2, mapAreaHeight / 2];

      d3.select('#watermark-svg')
        .attr('viewBox', `0 0 ${w} ${h}`)
        .attr('width', w)
        .attr('height', h);
    }

    function createProjection() {
      projection = d3.geoOrthographic()
        .clipAngle(90)
        .scale(state.baseScale * state.zoom)
        .translate(state.mapCenter)
        .rotate(state.rotation);
      path = d3.geoPath(projection, ctx);
    }

    function render() {
      projection
        .rotate(state.rotation)
        .scale(state.baseScale * state.zoom);

      ctx.clearRect(0, 0, state.width, state.height);

      ctx.save();
      state.constellations.forEach(f => {
        const isSco = f.id === 'Sco';
        ctx.beginPath();
        path(f);
        if (isSco) {
          ctx.strokeStyle = 'rgba(150, 195, 240, 0.42)';
          ctx.lineWidth = 1.3;
        } else {
          ctx.strokeStyle = 'rgba(110, 145, 190, 0.13)';
          ctx.lineWidth = 0.6;
        }
        ctx.stroke();
      });
      ctx.restore();

      const halfPi = Math.PI / 2 - 0.015;
      for (let i = 0; i < state.stars.length; i++) {
        const s = state.stars[i];
        if (angularDistanceFromCenter(s.ra, s.dec) > halfPi) continue;

        const p = projection([s.ra, s.dec]);
        if (!p || isNaN(p[0]) || isNaN(p[1])) continue;

        const isSco = Math.abs(s.ra - SCO_RA) < 25 && Math.abs(s.dec - SCO_DEC) < 18;
        const r = sizeFromMag(s.mag) * (isSco ? 1.35 : 1);

        if (s.mag < 2.5) {
          const grad = ctx.createRadialGradient(p[0], p[1], 0, p[0], p[1], r * 4);
          grad.addColorStop(0, isSco ? 'rgba(180, 220, 255, 0.55)' : 'rgba(220, 235, 255, 0.35)');
          grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(p[0], p[1], r * 4, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.beginPath();
        ctx.arc(p[0], p[1], r, 0, Math.PI * 2);
        ctx.fillStyle = isSco ? (s.mag < 2 ? '#dcecff' : s.color) : s.color;
        ctx.globalAlpha = isSco ? 1 : 0.88;
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      updateWatermark();
    }

    const svgWatermark = d3.select('#watermark-svg');
    const defs = svgWatermark.append('defs');
    const filt = defs.append('filter')
      .attr('id', 'wglow')
      .attr('x', '-50%').attr('y', '-50%')
      .attr('width', '200%').attr('height', '200%');
    filt.append('feGaussianBlur').attr('stdDeviation', '2.2').attr('result', 'blur');
    const merge = filt.append('feMerge');
    merge.append('feMergeNode').attr('in', 'blur');
    merge.append('feMergeNode').attr('in', 'SourceGraphic');

    const watermarkG = svgWatermark.append('g')
      .attr('id', 'sco-watermark')
      .attr('opacity', 0.9);

    watermarkG.append('text')
      .attr('text-anchor', 'middle')
      .attr('dominant-baseline', 'central')
      .attr('font-family', 'serif')
      .attr('font-size', '230')
      .attr('fill', 'rgba(140, 180, 230, 0.055)')
      .attr('stroke', 'rgba(160, 200, 245, 0.16)')
      .attr('stroke-width', '1.4')
      .attr('filter', 'url(#wglow)')
      .text('♏');

    function updateWatermark() {
      const p = projection([SCO_RA, SCO_DEC]);
      if (!p || isNaN(p[0]) || isNaN(p[1])) {
        watermarkG.style('display', 'none');
        return;
      }
      watermarkG.style('display', null)
        .attr('transform', `translate(${p[0]}, ${p[1]})`);
    }

    function setupInteractions() {
      canvas.addEventListener('mousedown', e => {
        state.dragging = true;
        state.didDrag = false;
        state.lastMouse = [e.clientX, e.clientY];
        canvas.classList.add('dragging');
      });

      window.addEventListener('mousemove', e => {
        if (!state.dragging) return;
        const dx = e.clientX - state.lastMouse[0];
        const dy = e.clientY - state.lastMouse[1];
        if (Math.abs(dx) + Math.abs(dy) > 2) state.didDrag = true;

        state.rotation = [
          state.rotation[0] + dx * 0.25,
          Math.max(-90, Math.min(90, state.rotation[1] - dy * 0.25)),
          0
        ];
        state.lastMouse = [e.clientX, e.clientY];
        render();
      });

      window.addEventListener('mouseup', () => {
        state.dragging = false;
        canvas.classList.remove('dragging');
      });

      canvas.addEventListener('wheel', e => {
        e.preventDefault();
        const factor = e.deltaY > 0 ? 0.92 : 1.08;
        state.zoom = Math.max(0.6, Math.min(6, state.zoom * factor));
        render();
      }, { passive: false });

      canvas.addEventListener('touchstart', e => {
        if (e.touches.length === 1) {
          state.dragging = true;
          state.didDrag = false;
          state.lastMouse = [e.touches[0].clientX, e.touches[0].clientY];
        }
      }, { passive: true });

      canvas.addEventListener('touchmove', e => {
        if (!state.dragging || e.touches.length !== 1) return;
        const t = e.touches[0];
        const dx = t.clientX - state.lastMouse[0];
        const dy = t.clientY - state.lastMouse[1];
        if (Math.abs(dx) + Math.abs(dy) > 2) state.didDrag = true;

        state.rotation = [
          state.rotation[0] + dx * 0.25,
          Math.max(-90, Math.min(90, state.rotation[1] - dy * 0.25)),
          0
        ];
        state.lastMouse = [t.clientX, t.clientY];
        render();
      }, { passive: true });

      canvas.addEventListener('touchend', () => { state.dragging = false; }, { passive: true });

      canvas.addEventListener('click', e => {
        if (state.didDrag) return;
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;

        let nearest = null;
        let minDist = 14;
        const halfPi = Math.PI / 2 - 0.015;

        for (let i = 0; i < state.stars.length; i++) {
          const s = state.stars[i];
          if (angularDistanceFromCenter(s.ra, s.dec) > halfPi) continue;
          const p = projection([s.ra, s.dec]);
          if (!p || isNaN(p[0])) continue;
          const d = Math.hypot(p[0] - mx, p[1] - my);
          if (d < minDist) { minDist = d; nearest = s; }
        }

        if (nearest) {
          const label = nearest.name
            ? `${nearest.name} · mag ${nearest.mag.toFixed(1)}`
            : `mag ${nearest.mag.toFixed(1)} · RA ${nearest.ra.toFixed(1)}° Dec ${nearest.dec.toFixed(1)}°`;
          tooltipEl.textContent = label;
          tooltipEl.style.left = (e.clientX + 14) + 'px';
          tooltipEl.style.top  = (e.clientY - 34) + 'px';
          tooltipEl.classList.add('visible');
          clearTimeout(setupInteractions._t);
          setupInteractions._t = setTimeout(() => {
            tooltipEl.classList.remove('visible');
          }, 2800);
        } else {
          tooltipEl.classList.remove('visible');
        }
      });

      document.getElementById('focus-btn').addEventListener('click', () => {
        animateTo([-SCO_RA, -SCO_DEC, 0], 1);
      });
    }

    function animateTo(targetRotation, targetZoom) {
      const startRot = [...state.rotation];
      const startZoom = state.zoom;
      const duration = 1200;
      const t0 = performance.now();

      function frame(now) {
        const t = Math.min(1, (now - t0) / duration);
        const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        state.rotation = [
          startRot[0] + (targetRotation[0] - startRot[0]) * e,
          startRot[1] + (targetRotation[1] - startRot[1]) * e,
          0
        ];
        state.zoom = startZoom + (targetZoom - startZoom) * e;
        render();
        if (t < 1) requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        setupCanvas();
        createProjection();
        render();
      }, 200);
    });

    async function init() {
      try {
        setupCanvas();
        createProjection();
        await loadData();
        loadingEl.classList.add('hidden');
        setupInteractions();
        render();
      } catch (err) {
        console.error('Error cargando los datos astronómicos:', err);
        loadingEl.textContent =
          'No se pudo cargar el cielo nocturno. Verifica tu conexión a internet y recarga la página.';
      }
    }

    init();
  })();
  </script>

  <!-- ============================================================
       MENSAJES METEORO ROMÁNTICOS (INLINE, sin archivo externo)
       ============================================================ -->
  <script>
  (function () {
    'use strict';

    console.log('[Meteoros] Script cargado.');

    const MESSAGES = [
      "Te amo",
      "Gracias por aparecer en mi vida",
      "Eres todo lo que siempre soñé",
      "Me haces muy feliz",
      "Tienes una sonrisa demasiado hermosa",
      "Enséñale a las estrellas cómo se brilla",
      "Besitoooos",
      "Ten un día muy feliz",
      "Eres mi constelación favorita",
      "A tu lado todo brilla más",
      "Tu risa es mi melodía favorita",
      "Iluminas hasta el cielo más oscuro",
      "Cada día contigo es un regalo",
      "Eres magia hecha persona",
      "Mi lugar favorito es a tu lado"
    ];

    const COLORS = [
      { color: '#ffe0a8', glow: 'rgba(255, 210, 140, 0.90)', soft: 'rgba(255, 200, 120, 0.35)', softer: 'rgba(255, 190, 100, 0.15)' },
      { color: '#ffd0dc', glow: 'rgba(255, 180, 200, 0.90)', soft: 'rgba(255, 160, 180, 0.35)', softer: 'rgba(255, 140, 165, 0.15)' },
      { color: '#dcd0ff', glow: 'rgba(200, 180, 255, 0.90)', soft: 'rgba(190, 170, 250, 0.35)', softer: 'rgba(180, 160, 245, 0.15)' },
      { color: '#d0e4ff', glow: 'rgba(170, 205, 255, 0.90)', soft: 'rgba(160, 195, 250, 0.35)', softer: 'rgba(150, 185, 245, 0.15)' }
    ];

    function spawnMeteor() {
      try {
        const msg = MESSAGES[Math.floor(Math.random() * MESSAGES.length)];
        const col = COLORS[Math.floor(Math.random() * COLORS.length)];

        const el = document.createElement('div');
        el.className = 'meteor-message';
        el.textContent = msg;
        el.style.setProperty('--m-color', col.color);
        el.style.setProperty('--m-glow', col.glow);
        el.style.setProperty('--m-glow-soft', col.soft);
        el.style.setProperty('--m-glow-softer', col.softer);
        document.body.appendChild(el);

        const w = window.innerWidth;
        const h = window.innerHeight;
        const mapAreaHeight = h - 120;
        const cx = w / 2;
        const cy = mapAreaHeight / 2;
        const radius = Math.min(w, mapAreaHeight) * 0.44;

        let elW = el.offsetWidth;
        if (!elW || elW < 10) elW = msg.length * 18;

        const leftZone  = cx - radius;
        const rightZone = w - cx - radius;
        const topZone   = cy - radius;
        const hasLateralSpace = Math.max(leftZone, rightZone) > 150;

        let startX, startY, endX, endY, dir;

        if (hasLateralSpace) {
          const useLeft = leftZone >= rightZone;
          if (useLeft) {
            dir = 1;
            startX = -elW - 20;
            endX   = Math.max(30, leftZone - 20);
          } else {
            dir = -1;
            startX = w + 20;
            endX   = Math.min(w - 30, cx + radius + 20);
          }
          startY = 40 + Math.random() * Math.max(60, topZone * 0.6);
          endY   = Math.min(startY + 180 + Math.random() * 320, mapAreaHeight - 100);
        } else {
          dir = Math.random() > 0.5 ? 1 : -1;
          startY = 30 + Math.random() * 50;
          endY   = startY + 40 + Math.random() * 50;
          if (dir === 1) {
            startX = -elW - 20;
            endX   = w + 20;
          } else {
            startX = w + 20;
            endX   = -elW - 20;
          }
        }

        el.dataset.dir = dir;

        const duration = 9000 + Math.random() * 4000;

        console.log('[Meteoros] Spawn:', msg, '| desde', Math.round(startX), Math.round(startY), '→', Math.round(endX), Math.round(endY));

        const anim = el.animate([
          { transform: `translate(${startX}px, ${startY}px)`, opacity: 0 },
          { transform: `translate(${startX + (endX - startX) * 0.10}px, ${startY + (endY - startY) * 0.10}px)`, opacity: 1, offset: 0.10 },
          { transform: `translate(${startX + (endX - startX) * 0.85}px, ${startY + (endY - startY) * 0.85}px)`, opacity: 1, offset: 0.85 },
          { transform: `translate(${endX}px, ${endY}px)`, opacity: 0 }
        ], {
          duration: duration,
          easing: 'linear',
          fill: 'forwards'
        });

        anim.onfinish = () => el.remove();
        anim.oncancel = () => el.remove();
      } catch (err) {
        console.error('[Meteoros] Error en spawn:', err);
      }
    }

    function scheduleNext() {
      const delay = 3000 + Math.random() * 3000;
      setTimeout(() => {
        spawnMeteor();
        scheduleNext();
      }, delay);
    }

    let started = false;
    const startOnce = () => {
      if (started) return;
      started = true;
      console.log('[Meteoros] Iniciando primer meteoro.');
      spawnMeteor();
      scheduleNext();
    };

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(startOnce).catch(startOnce);
    }
    setTimeout(startOnce, 1200);
  })();
  </script>

</body>
